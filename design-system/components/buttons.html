<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, default, ghost and block, with the teal focus ring" viewport="640x420" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buttons — Roamance</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px; }
  .ds-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .ds-stack { display: flex; flex-direction: column; gap: var(--space-5); }
  .ds-label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .ds-note { font-size: 12.5px; color: var(--ink-2); max-width: 62ch; }
</style>
</head>
<body>
<div class="ds-stack">
  <div>
    <h2 style="font-size:20px">Buttons</h2>
    <p class="ds-note">One primary per screen. Ghost is for the top bar and anything reversible. Focus is a
    2px teal ring at 2px offset — never the browser default, and never removed.</p>
  </div>
  <div class="ds-row">
    <button class="btn btn--primary">Find your type</button>
    <button class="btn">Back to your deck</button>
    <button class="btn btn--ghost">Reset</button>
    <button class="btn" disabled>Pick at least one board</button>
  </div>
  <div>
    <div class="ds-label">Block</div>
    <div style="max-width:320px;margin-top:8px">
      <button class="btn btn--primary btn--block">See your matches</button>
    </div>
  </div>
  <div>
    <div class="ds-label">Segmented</div>
    <div class="segmented" style="max-width:320px;margin-top:8px">
      <button aria-pressed="true">Vibe match</button>
      <button aria-pressed="false">Price</button>
      <button aria-pressed="false">Length</button>
    </div>
  </div>
</div>
</body>
</html>
